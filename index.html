<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f111a">
<title>Character Codex — Etta Global Partners</title>
<style>
/* ============================================================
   CHARACTER CODEX — shared design system
   Illuminated compendium: parchment + ink, per-clan elemental accent.
   Fraunces (display) · IBM Plex Sans (body) · IBM Plex Mono (data)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#eef0f6; --ink-2:#a8b0c2; --bark:#737c92;
  --parchment:#0f111a; --surface:#181b26; --surface-2:#1f2331; --surface-3:#282d3d;
  --line:#2d3346; --line-2:#404a64;
  --accent:#6ea6ff; --glow:#9cc2ff;            /* overridden per clan */
  --danger:#ff6b5c; --ok:#57c98a; --done:#8fe05a;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --maxw:1200px; --radius:14px;
  --shadow:0 22px 54px -26px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--parchment); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 620px at 14% -12%, rgba(110,166,255,.10), transparent 60%),
    radial-gradient(1000px 520px at 102% -4%, rgba(130,120,255,.07), transparent 55%);
  background-attachment:fixed;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--glow); outline-offset:3px; border-radius:6px}
button{font-family:inherit}
img{max-width:100%; display:block}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px}
.mono{font-family:var(--mono)}
.hidden{display:none !important}

/* ---------- TOP NAV ---------- */
.topbar{position:sticky; top:0; z-index:40; background:rgba(8,9,13,.72);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.topbar-in{max-width:var(--maxw); margin:0 auto; padding:11px 22px; display:flex; align-items:center; gap:20px}
.brand{display:flex; flex-direction:column; line-height:1.05; text-decoration:none}
.brand b{font-family:var(--display); font-weight:900; font-size:19px; letter-spacing:-.01em; color:var(--ink)}
.brand span{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--bark)}
.nav{margin-left:auto; display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.nav a{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
  padding:8px 13px; border-radius:20px}
.nav a:hover{background:var(--surface-2); text-decoration:none}
.nav a.active{background:var(--ink); color:var(--parchment)}

/* ---------- GENERIC SECTION HEADS ---------- */
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--glow); display:flex; align-items:center; gap:10px; margin-bottom:8px}
.eyebrow::before{content:""; width:24px; height:2px; background:var(--accent)}
.h-title{font-family:var(--display); font-weight:600; font-size:clamp(30px,5vw,46px); letter-spacing:-.02em; margin:0 0 8px}
.h-sub{max-width:62ch; color:var(--ink-2); margin:0}

/* ============================================================ HOME */
.hero{padding:64px 0 26px; border-bottom:2px solid var(--ink)}
.hero .studio{font-family:var(--mono); font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent);
  display:flex; align-items:center; gap:10px}
.hero .studio::before{content:""; width:26px; height:2px; background:var(--accent)}
.hero h1{font-family:var(--display); font-weight:900; font-size:clamp(44px,8.5vw,92px); line-height:.9;
  letter-spacing:-.025em; margin:14px 0 6px}
.hero h1 em{font-style:italic; font-weight:400; color:var(--accent)}
.hero p{font-family:var(--display); font-style:italic; font-size:clamp(17px,2.4vw,23px); color:var(--ink-2); max-width:48ch; margin:0 0 22px}
.hero-stats{display:flex; flex-wrap:wrap; gap:8px 30px; font-family:var(--mono); font-size:12px; color:var(--bark)}
.hero-stats b{color:var(--ink); font-weight:600}

.clan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; padding:34px 0 20px}
.clan-tile{position:relative; overflow:hidden; border-radius:var(--radius); border:1px solid var(--line-2);
  background:var(--surface); padding:22px 22px 20px; text-decoration:none; color:var(--ink);
  transition:transform .18s, box-shadow .18s, border-color .18s; min-height:186px; display:flex; flex-direction:column}
.clan-tile:hover{transform:translateY(-4px); box-shadow:var(--shadow); text-decoration:none; border-color:var(--taccent)}
.clan-tile::before{content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--taccent)}
.clan-tile::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, var(--tglow), transparent 70%); opacity:.22}
.clan-tile .el{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--taccent)}
.clan-tile h3{font-family:var(--display); font-weight:600; font-size:30px; margin:6px 0 6px}
.clan-tile p{color:var(--ink-2); font-size:14.5px; margin:0 0 auto}
.clan-tile .trow{display:flex; gap:16px; margin-top:16px; font-family:var(--mono); font-size:11px; color:var(--bark)}
.clan-tile .trow b{color:var(--ink); font-weight:600; font-size:18px; font-family:var(--display)}
.clan-tile .go{position:absolute; right:18px; bottom:16px; font-family:var(--mono); font-size:20px; color:var(--taccent); opacity:.7}

/* ============================================================ CLAN VIEW */
.clan-hero{position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(120% 150% at 88% 6%, color-mix(in srgb, var(--glow) 58%, transparent), transparent 55%),
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 94%, #17110c), color-mix(in srgb, var(--accent) 50%, #0b0907));
  padding:62px 0 54px}
.clan-hero-in{position:relative; display:flex; align-items:center; gap:24px}
.clan-hero-text{position:relative; z-index:2; flex:1}
.clan-hero .el{font-family:var(--mono); font-size:12px; letter-spacing:.26em; text-transform:uppercase;
  color:rgba(255,255,255,.74); display:flex; align-items:center; gap:10px; font-weight:500}
.clan-hero .el::before{content:""; width:28px; height:2px; background:currentColor}
.clan-hero h1{font-family:var(--display); font-weight:900; font-size:clamp(46px,8.4vw,90px); line-height:.88;
  letter-spacing:-.035em; margin:14px 0 10px; color:#fff; text-shadow:0 2px 40px rgba(0,0,0,.28)}
.clan-hero p{font-family:var(--display); font-style:italic; font-size:clamp(17px,2.4vw,23px);
  color:rgba(255,255,255,.88); margin:0; max-width:48ch}
.clan-glyph{position:absolute; right:-24px; top:50%; transform:translateY(-50%); width:min(370px,44vw);
  color:#fff; opacity:.13; z-index:1; pointer-events:none}
.clan-glyph svg{width:100%; height:auto; display:block}
.clan-switch-wrap{background:var(--surface); border-bottom:1px solid var(--line-2); position:sticky; top:57px; z-index:20}
.clan-switch{display:flex; gap:7px; flex-wrap:wrap; padding:13px 0}
.clan-switch a{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:7px 13px;
  border-radius:20px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface); transition:all .15s}
.clan-switch a:hover{text-decoration:none; border-color:var(--accent); color:var(--accent)}
.clan-switch a.active{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 8px 18px -12px var(--accent)}

/* filter bar */
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:22px 0 6px}
.search{flex:1; min-width:220px; display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--line-2); border-radius:24px; padding:9px 16px}
.search input{border:none; background:transparent; outline:none; font-family:var(--body); font-size:14px; color:var(--ink); width:100%}
.chipset{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:7px 12px;
  border-radius:20px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.count-note{font-family:var(--mono); font-size:11px; color:var(--bark); padding:8px 0 0}

/* tier section */
.tier{padding:24px 0 4px}
.tier-head{display:flex; align-items:baseline; gap:12px; margin-bottom:14px}
.tier-head h2{font-family:var(--display); font-weight:600; font-size:22px; margin:0; color:var(--ink)}
.tier-head .line{flex:1; height:1px; background:var(--line-2)}
.tier-head .cnt{font-family:var(--mono); font-size:11px; color:var(--bark)}

/* ============================================================ CHARACTER CARD */
.card-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:20px}
@media (max-width:1280px){.card-grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:1080px){.card-grid{grid-template-columns:repeat(4,1fr); gap:16px}}
@media (max-width:880px){.card-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.card-grid{grid-template-columns:repeat(2,1fr); gap:12px}}
@media (max-width:420px){.card-grid{grid-template-columns:1fr}}
.ccard{position:relative; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; cursor:pointer; text-align:left;
  transition:transform .16s, box-shadow .16s, border-color .16s; padding:0}
.ccard:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--accent)}
.ccard .thumb{aspect-ratio:1/1; background:radial-gradient(circle at 50% 34%, var(--surface), var(--surface-3));
  border-bottom:1px solid var(--line); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center}
.ccard .thumb img{width:100%; height:100%; object-fit:cover; object-position:center top}
.ccard .thumb .imgcount{position:absolute; right:8px; bottom:8px; font-family:var(--mono); font-size:10px; color:#fff;
  background:rgba(22,33,27,.62); padding:2px 7px; border-radius:20px}
.ccard .noimg{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--bark)}
.ccard .noimg .glyph{font-family:var(--display); font-weight:900; font-size:40px; color:var(--line-2); line-height:1}
.ccard .noimg span{font-family:var(--mono); font-size:10px; letter-spacing:.08em}
.ccard .num{position:absolute; top:8px; left:9px; font-family:var(--mono); font-weight:600; font-size:10px; color:#fff;
  background:rgba(22,33,27,.6); padding:2px 7px; border-radius:20px; z-index:2}
.ccard .mana{position:absolute; top:8px; right:9px; font-family:var(--mono); font-weight:600; font-size:11px; color:#fff;
  background:var(--accent); padding:2px 8px; border-radius:20px; z-index:2}
.ccard .cbody{padding:12px 13px 13px; display:flex; flex-direction:column; gap:8px}
.ccard .cname{font-family:var(--display); font-weight:600; font-size:17px; line-height:1.08; margin:0; color:var(--ink)}
.ccard .roles{display:flex; gap:5px; flex-wrap:wrap}
.role{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:6px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2)}
.role.arch{border-color:var(--accent); color:var(--accent)}
/* stat spread mini viz */
.spread{display:grid; grid-template-columns:auto 1fr; gap:3px 8px; align-items:center; margin-top:2px}
.spread .lab{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--bark)}
.spread .bar{height:6px; border-radius:6px; background:var(--surface-3); overflow:hidden; border:1px solid var(--line)}
.spread .bar i{display:block; height:100%; border-radius:6px}
.b-hp i{background:linear-gradient(90deg,var(--accent),var(--glow))}
.b-sh i{background:#c9a24a}
.b-sp i{background:#4a90c9}
.b-dm i{background:#c05a3a}
.ccard .abils{display:flex; gap:4px; flex-wrap:wrap}
.abil{font-family:var(--mono); font-size:9px; letter-spacing:.03em; padding:2px 6px; border-radius:5px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2)}

/* ============================================================ MODAL (detail) */
.modal-back{position:fixed; inset:0; z-index:60; background:rgba(15,18,15,.62); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; overflow:auto}
.modal{background:var(--surface); border:1px solid var(--line-2); border-radius:18px; max-width:840px; width:100%;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.5); overflow:hidden}
.modal-top{display:grid; grid-template-columns:1.1fr 1fr; gap:0}
.modal-gallery{background:var(--surface-3); min-height:300px; display:flex; flex-direction:column}
.gal-main{flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:280px; overflow:hidden}
.gal-main img{width:100%; height:100%; object-fit:cover; max-height:420px}
.gal-empty{display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--bark); padding:40px}
.gal-empty .glyph{font-family:var(--display); font-weight:900; font-size:60px; color:var(--line-2)}
.gal-thumbs{display:flex; gap:6px; padding:8px; overflow-x:auto; background:var(--surface-2)}
.gal-thumbs button{flex:0 0 auto; width:54px; height:54px; border-radius:8px; overflow:hidden; border:2px solid transparent;
  cursor:pointer; padding:0; background:var(--surface-3)}
.gal-thumbs button.active{border-color:var(--accent)}
.gal-thumbs img{width:100%; height:100%; object-fit:cover}
.modal-info{padding:22px 24px}
.modal-info .el{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent)}
.modal-info h2{font-family:var(--display); font-weight:600; font-size:28px; margin:4px 0 10px; line-height:1.05}
.stat-table{width:100%; border-collapse:collapse; margin:8px 0 12px; font-family:var(--mono); font-size:12px}
.stat-table th{text-align:left; color:var(--bark); font-weight:500; letter-spacing:.08em; text-transform:uppercase; font-size:10px; padding:4px 6px}
.stat-table td{padding:5px 6px; border-top:1px solid var(--line); color:var(--ink)}
.stat-table td:first-child{color:var(--bark)}
.kv{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.kv .k{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:5px 9px}
.kv .k b{color:var(--accent)}
.abil-list{margin:10px 0 0; padding:0; list-style:none; display:grid; gap:7px}
.abil-list li{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px}
.abil-list li b{font-family:var(--mono); font-size:12px; color:var(--accent); display:block; margin-bottom:2px}
.abil-list li span{font-size:12.5px; color:var(--ink-2)}
.modal-actions{display:flex; gap:8px; padding:14px 24px 20px; border-top:1px solid var(--line); background:var(--surface-2)}

/* ============================================================ BUTTONS */
.btn{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; border-radius:22px;
  padding:10px 18px; border:1px solid var(--ink); background:var(--ink); color:var(--parchment); cursor:pointer;
  transition:transform .12s, opacity .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.danger{background:transparent; color:var(--danger); border-color:var(--danger)}
.btn.sm{padding:7px 13px; font-size:11px}
.iconbtn{width:34px; height:34px; border-radius:50%; border:1px solid var(--line-2); background:var(--surface);
  cursor:pointer; font-size:16px; color:var(--ink); display:flex; align-items:center; justify-content:center}

/* ============================================================ DASHBOARD */
.dash-head{padding:44px 0 8px; border-bottom:2px solid var(--ink)}
.dash-grid{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:26px; padding:26px 0 60px; align-items:start}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr}}
.dash-toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.dash-list{display:flex; flex-direction:column; gap:8px; max-height:none}
.row{display:grid; grid-template-columns:46px 1fr auto; gap:12px; align-items:center; background:var(--surface);
  border:1px solid var(--line-2); border-radius:12px; padding:9px 12px}
.row .rthumb{width:46px; height:46px; border-radius:9px; overflow:hidden; background:var(--surface-3);
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:9px; color:var(--bark)}
.row .rthumb img{width:100%; height:100%; object-fit:cover}
.row .rmain b{font-family:var(--display); font-size:16px; font-weight:600}
.row .rmeta{font-family:var(--mono); font-size:10.5px; color:var(--bark)}
.row .clan-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle}
.row .ract{display:flex; gap:6px}

/* editor panel (sticky) */
.editor{position:sticky; top:74px; background:var(--surface); border:1px solid var(--line-2); border-radius:16px;
  padding:20px; box-shadow:var(--shadow)}
.editor h3{font-family:var(--display); font-weight:600; font-size:20px; margin:0 0 3px}
.editor .esub{font-family:var(--mono); font-size:10.5px; color:var(--bark); letter-spacing:.04em; margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--bark); margin-bottom:4px}
.field input, .field select, .field textarea{width:100%; font-family:var(--body); font-size:14px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; padding:9px 11px; outline:none}
.field textarea{resize:vertical; min-height:52px}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.hint{font-family:var(--mono); font-size:9.5px; color:var(--bark); margin-top:3px}

/* dropzone + image previews */
.dropzone{border:2px dashed var(--line-2); border-radius:12px; padding:18px; text-align:center; cursor:pointer;
  background:var(--surface-2); transition:border-color .15s, background .15s}
.dropzone:hover, .dropzone.over{border-color:var(--accent); background:var(--surface-3)}
.dropzone .dz-glyph{font-size:22px}
.dropzone p{margin:6px 0 0; font-family:var(--mono); font-size:11px; color:var(--bark)}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:8px; margin-top:12px}
.thumb-item{position:relative; border-radius:9px; overflow:hidden; aspect-ratio:1/1; border:2px solid var(--line-2); background:var(--surface-3)}
.thumb-item.primary{border-color:var(--accent)}
.thumb-item img{width:100%; height:100%; object-fit:cover}
.thumb-item .rm{position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; border:none;
  background:rgba(22,33,27,.72); color:#fff; font-size:12px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center}
.thumb-item .star{position:absolute; bottom:3px; left:3px; width:20px; height:20px; border-radius:50%; border:none;
  background:rgba(22,33,27,.55); color:#fff; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center}
.thumb-item.primary .star{background:var(--accent)}
.thumb-card{display:flex; flex-direction:column; gap:4px}
.thumb-cap{font-family:var(--mono); font-size:10px; color:var(--bark); line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.editor-actions{display:flex; gap:8px; margin-top:16px}
.history-block{margin-top:16px}
.history-list{list-style:none; margin:8px 0 0; padding:0; max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:6px}
.history-list li{font-size:12px; line-height:1.4; border-left:2px solid var(--line-2); padding-left:9px}
.history-list .hist-who{font-weight:600}
.history-list .hist-when{font-family:var(--mono); font-size:10px; color:var(--bark)}
.history-empty{font-size:12px; color:var(--bark)}

/* toast */
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:80;
  background:var(--ink); color:var(--parchment); font-family:var(--mono); font-size:12px; padding:11px 18px;
  border-radius:24px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; box-shadow:var(--shadow)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* empty states */
.empty-state{text-align:center; padding:60px 20px; color:var(--bark)}
.empty-state .glyph{font-family:var(--display); font-weight:900; font-size:60px; color:var(--line-2)}
.empty-state p{font-family:var(--mono); font-size:12px; margin:8px 0 16px}

/* ---------- auth / admin ---------- */
.auth-wrap{max-width:460px; margin:70px auto; padding:0 22px}
.auth-card{background:var(--surface); border:1px solid var(--line-2); border-radius:18px; padding:32px 30px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.auth-card::before{content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--accent)}
.auth-card .lockicon{font-size:30px; line-height:1}
.auth-card h1{font-family:var(--display); font-weight:600; font-size:28px; margin:12px 0 4px; letter-spacing:-.01em}
.auth-card p.sub{color:var(--ink-2); font-size:14px; margin:0 0 20px}
.auth-err{color:var(--danger); font-family:var(--mono); font-size:12px; margin:2px 0 12px; min-height:16px}
.auth-note{font-family:var(--mono); font-size:10.5px; color:var(--bark); margin-top:18px; line-height:1.6; border-top:1px solid var(--line); padding-top:14px}
.admin-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--line-2); border-radius:12px; padding:9px 14px; margin-bottom:18px}
.admin-bar .who{font-family:var(--mono); font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:8px}
.admin-bar .dot{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent)}
.admin-bar .spacer{flex:1}
.pw-panel{background:var(--surface); border:1px solid var(--line-2); border-radius:12px; padding:16px; margin-bottom:18px}
.pw-panel .grid3{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end}
@media (max-width:760px){.pw-panel .grid3{grid-template-columns:1fr 1fr}}

/* ---------- storage fallback banner ---------- */
.mem-banner{background:#fbf1d8; border:1px solid #e4c877; color:#6b4e12; border-radius:12px; padding:11px 15px;
  font-size:13px; line-height:1.5; margin:0 0 18px}
body.theme-dark .mem-banner{background:#2e2a1c; border-color:#5f5327; color:#e6d59a}

/* ---------- sprints ---------- */
.sprint-tag{font-family:var(--mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:6px;
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-2)}
.sprint-tag.s1{background:var(--accent); color:#fff; border-color:var(--accent)}
.sprint-badge{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 11px; border-radius:20px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface-2)}
.sprint-badge.s1{background:var(--accent); color:#fff; border-color:var(--accent)}
.tier-head .sprint-badge{margin-right:2px}

/* ---------- status pips ---------- */
.pips{display:flex; gap:3px; margin-top:4px}
.pips i{width:100%; height:6px; border-radius:4px; background:var(--surface-3); border:1px solid var(--line); flex:1}
.pips i.on{background:var(--ok); border-color:var(--ok)}
.row .pips{max-width:96px; margin:0}
/* modal production track */
.status-track{display:grid; gap:5px; margin:2px 0 4px}
.strack{font-family:var(--mono); font-size:12px; color:var(--bark); display:flex; align-items:center; gap:9px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 11px}
.strack .tick{color:var(--line-2)}
.strack.on{color:var(--ink); border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.strack.on .tick{color:var(--ok)}

/* ---------- editor status checkboxes ---------- */
.statboxes{display:grid; gap:7px}
.statbox{font-family:var(--body); font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; padding:8px 11px; cursor:pointer}
.statbox input{accent-color:var(--ok)}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

/* ---------- dashboard cleanup ---------- */
.chk{font-family:var(--mono); font-size:11px; color:var(--ink-2); display:flex; align-items:center; gap:6px; cursor:pointer;
  border:1px solid var(--line-2); border-radius:20px; padding:7px 13px; background:var(--surface)}
.dash-chips{margin-bottom:10px}
.list-note{font-family:var(--mono); font-size:10.5px; color:var(--bark); padding:2px 2px 8px}
.row{grid-template-columns:46px 1fr auto auto; }
.row .pips{order:0}
@media (max-width:620px){.row{grid-template-columns:40px 1fr auto} .row .pips{display:none}}

/* ---------- settings / panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line-2); border-radius:14px; padding:18px 18px; margin-bottom:18px; box-shadow:var(--shadow)}
.panel h3{font-family:var(--display); font-weight:600; font-size:19px; margin:0 0 12px}
.panel-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.divider{height:1px; background:var(--line); margin:16px 0}
.grid-pw{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end}
@media (max-width:760px){.grid-pw{grid-template-columns:1fr 1fr}}
.panel input[type=url], .panel input[type=password]{width:100%; font-family:var(--mono); font-size:13px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; padding:9px 11px; outline:none}
.panel input:focus{border-color:var(--accent)}
.guide{margin:6px 0 14px; padding-left:20px; color:var(--ink-2); font-size:13.5px; line-height:1.7}
.guide li{margin-bottom:5px}
.code{background:#1c2620; color:#d7e4d8; border-radius:10px; padding:14px; font-family:var(--mono); font-size:11px; line-height:1.55;
  overflow:auto; max-height:280px; white-space:pre; border:1px solid #2c3a30}

/* ---------- corner user login widget ---------- */
.user-slot{margin-left:8px; position:relative}
.uw-btn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line-2); border-radius:22px;
  padding:5px 12px 5px 6px; cursor:pointer; font-family:var(--body); color:var(--ink); transition:border-color .15s}
.uw-btn:hover{border-color:var(--accent)}
.uw-ava{width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; font-weight:600}
.uw-ava.sm{width:20px; height:20px; font-size:9px}
.uw-name{font-family:var(--mono); font-size:12px; letter-spacing:.02em}
.uw-name.muted{color:var(--bark)}
.uw-caret{color:var(--bark); font-size:10px}
.uw-menu{position:absolute; right:0; top:44px; width:230px; background:var(--surface); border:1px solid var(--line-2);
  border-radius:12px; box-shadow:var(--shadow); padding:6px; z-index:60}
.uw-head{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--bark); padding:6px 10px 4px}
.uw-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font-family:var(--body); font-size:13.5px; color:var(--ink); padding:8px 10px; border-radius:8px}
.uw-item:hover{background:var(--surface-2)}
.uw-item.active{color:var(--accent); font-weight:600}
.uw-sep{height:1px; background:var(--line); margin:5px 4px}
.uw-role{font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--bark);
  border:1px solid var(--line-2); border-radius:20px; padding:1px 7px; margin-left:2px}
.uw-role.admin{color:#8a6a15; border-color:#d8b24e; background:#fbf1d8}
.uw-mini{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--bark)}
.uw-ava.adm{background:#c99a2e}
@media (max-width:640px){.uw-name,.uw-role{display:none}}

/* login role picker */
.auth-wrap.wide{max-width:540px}
.picklist{display:grid; gap:9px; margin:6px 0 4px}
.pick{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:12px; padding:12px 14px; transition:border-color .15s, transform .12s}
.pick:hover{border-color:var(--accent); transform:translateY(-1px)}
.pick .pick-name{flex:1; font-family:var(--display); font-weight:600; font-size:17px; color:var(--ink)}
.pick .pick-role{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--bark)}
.pick .uw-ava{width:34px; height:34px; font-size:13px}

/* read-only assignment field */
.ro-field{font-family:var(--body); font-size:14px; color:var(--ink-2); background:var(--surface-3);
  border:1px dashed var(--line-2); border-radius:9px; padding:9px 11px}
.role-note{font-family:var(--mono); font-size:10.5px; color:var(--bark)}
.admin-bar .dot.artist{background:#c99a2e; box-shadow:0 0 0 3px color-mix(in srgb,#c99a2e 22%,transparent)}
.admin-bar.artist{background:color-mix(in srgb,#c99a2e 8%,var(--surface-2))}

/* ---------- completed highlight ---------- */
.ccard.done{border-color:var(--done); box-shadow:0 0 0 2px color-mix(in srgb,var(--done) 30%,transparent)}
.done-badge{position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:3; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.05em; background:var(--done); color:#20320f; font-weight:600; padding:3px 10px; border-radius:20px; box-shadow:var(--shadow)}
.done-chip{font-family:var(--mono); font-size:10px; letter-spacing:.04em; background:var(--done); color:#20320f; font-weight:600;
  padding:2px 9px; border-radius:20px; vertical-align:middle}
.done-chip.sm{padding:1px 6px; font-size:9px}
.row.done{border-color:var(--done); background:color-mix(in srgb,var(--done) 10%,var(--surface))}
.done-toggle{border-color:color-mix(in srgb,var(--done) 45%,var(--line-2)); background:color-mix(in srgb,var(--done) 8%,var(--surface-2))}
.assign{color:var(--accent)}
.user-list{display:flex; flex-wrap:wrap; gap:8px}
.user-chip{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px; background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:20px; padding:5px 8px 5px 5px; color:var(--ink)}
.user-chip button{border:0; background:none; color:var(--bark); cursor:pointer; font-size:14px; line-height:1; padding:0 2px}
.user-chip button:hover{color:var(--danger)}
.panel input{width:100%; font-family:var(--body); font-size:14px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:9px; padding:9px 11px; outline:none}

/* footer */
.foot{margin-top:40px; border-top:2px solid var(--ink); padding:24px 0 60px; font-family:var(--mono);
  font-size:11px; color:var(--bark); display:flex; flex-wrap:wrap; gap:8px 26px; justify-content:space-between}
.foot b{color:var(--ink)}
.foot .credit{color:var(--bark); opacity:.85; font-style:italic; font-family:var(--display); font-size:12px}

@media (max-width:560px){
  .modal-top{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto !important} }

/* ============================================================
   STATUS EDITOR (artist) + DESIGN POLISH PASS
   ============================================================ */
.se-head{display:flex; gap:12px; align-items:center; background:var(--surface-2); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; margin-bottom:12px}
.se-thumb{width:54px; height:54px; border-radius:10px; overflow:hidden; background:var(--surface-3);
  display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:22px; color:var(--bark); flex:0 0 auto}
.se-thumb img{width:100%; height:100%; object-fit:cover}
.se-name{font-family:var(--display); font-weight:600; font-size:18px}
.se-meta{font-family:var(--mono); font-size:10.5px; color:var(--bark); margin-top:2px}
.se-assign{display:flex; gap:18px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--bark); margin-bottom:14px; padding:0 2px}
.se-assign b{color:var(--ink)}
.weapon-box{display:flex; align-items:center; gap:10px}
.weapon-box img{width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
.weapon-noimg{width:48px; height:48px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px dashed var(--line); font-size:18px; color:var(--bark)}

/* --- refined depth: softer, layered shadows --- */
:root{--shadow:0 1px 2px rgba(22,33,27,.04), 0 22px 44px -30px rgba(22,33,27,.42)}
.clan-tile,.panel,.editor,.modal,.row,.uw-menu,.toast{box-shadow:var(--shadow)}

/* --- cards: image zoom + crisper interaction --- */
.ccard .thumb{overflow:hidden}
.ccard .thumb img{transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.ccard:hover .thumb img{transform:scale(1.05)}
.ccard{transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, border-color .2s}
.ccard:hover{box-shadow:0 2px 4px rgba(22,33,27,.05), 0 26px 46px -26px rgba(22,33,27,.5)}
.clan-tile{transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s, border-color .2s}

/* --- type refinement --- */
.hero h1{letter-spacing:-.035em}
.h-title,.tier-head h2,.clan-banner h1,.clan-tile h3{letter-spacing:-.022em}
.eyebrow,.hero .studio,.clan-banner .el{font-weight:500}

/* --- buttons & chips: subtle lift --- */
.btn{letter-spacing:.08em}
.btn.accent{box-shadow:0 10px 22px -14px color-mix(in srgb, var(--accent) 85%, transparent)}
.btn.accent:hover{filter:brightness(1.04)}
.chip{transition:background .15s, border-color .15s, box-shadow .15s, color .15s}
.chip[aria-pressed="true"]{box-shadow:0 8px 18px -12px color-mix(in srgb, var(--accent) 65%, transparent)}

/* --- topbar polish --- */
.topbar{border-bottom:1px solid var(--line-2)}
.nav a.active{box-shadow:0 8px 18px -12px rgba(22,33,27,.5)}

/* --- banners & sections --- */
.clan-banner{background:linear-gradient(180deg, color-mix(in srgb, var(--glow) 6%, transparent), transparent 60%)}
.tier-head .line{background:linear-gradient(90deg, var(--line-2), transparent)}
.hero{background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, transparent), transparent 55%)}

/* --- pips get a soft glow when complete --- */
.pips i.on{box-shadow:0 0 0 1px color-mix(in srgb, var(--ok) 40%, transparent)}

/* --- focus ring refinement --- */
:focus-visible{outline:2.5px solid var(--glow); outline-offset:3px; border-radius:6px}

/* --- modal polish --- */
.modal{box-shadow:0 40px 90px -30px rgba(0,0,0,.55)}
.modal-gallery{background:linear-gradient(160deg, var(--surface-3), var(--surface-2))}

/* ============================================================
   CLAN COLOR IDENTITY + BOLDER LOOK (v3)
   ============================================================ */
/* each clan page gets a subtle wash in its own colour (light base kept) */
body.on-clan{background-color:#0b0d13; background-image:
  radial-gradient(1000px 580px at 6% -6%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 46%),
  radial-gradient(920px 520px at 100% 2%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 46%);}

/* cards become accent-plated codex specimens */
.ccard{border-top:3px solid var(--accent)}
.ccard .thumb{background:radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface-3))}
.ccard .noimg .glyph{color:color-mix(in srgb, var(--accent) 32%, var(--line-2))}
.ccard:hover{border-color:var(--accent)}

/* home hero: bolder + a spectrum of the six clan colours */
.hero h1{font-size:clamp(52px,10vw,104px)}
.spectrum{display:flex; height:9px; border-radius:20px; overflow:hidden; margin:24px 0 0; box-shadow:var(--shadow)}
.spectrum span{flex:1; transition:flex .3s}
.hero:hover .spectrum span:hover{flex:1.6}

/* clan tiles: coloured top band + elemental glyph */
.clan-tile{padding-top:26px}
.clan-tile::before{width:100%; height:6px; inset:0 0 auto 0; background:linear-gradient(90deg, var(--taccent), var(--tglow))}
.clan-tile::after{width:180px; height:180px; right:-50px; top:-50px}
.clan-tile .tglyph{position:absolute; right:16px; top:20px; width:44px; height:44px; color:var(--taccent); opacity:.92; z-index:1}
.clan-tile .tglyph svg{width:100%; height:100%; display:block}
.clan-tile .el{color:var(--taccent); font-weight:500}
.clan-tile h3{margin-top:10px}
.clan-tile:hover{border-color:var(--taccent); box-shadow:0 2px 4px rgba(22,33,27,.05), 0 28px 50px -26px color-mix(in srgb, var(--taccent) 45%, rgba(22,33,27,.5))}

/* filter chips active use clan colour on clan pages (accent already themed) */
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}

/* tier/sprint section headers get a touch of the clan colour */
.tier-head h2{color:var(--ink)}
.sprint-badge.s1{background:var(--accent); border-color:var(--accent)}

/* modal top uses the clan accent as a thin crown */
.modal{border-top:4px solid var(--accent)}

/* ============================================================ PARTICLES */
.particle-canvas{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
.hero{position:relative; overflow:hidden}
.hero .wrap{position:relative; z-index:1}
.clan-hero .clan-hero-in{position:relative; z-index:2}
.clan-hero .clan-glyph{z-index:1}
@media (prefers-reduced-motion:reduce){ .particle-canvas{display:none} }

/* ============================================================
   DARK CINEMATIC THEME — component fixes (mesh3d-inspired)
   ============================================================ */
/* soften the heavy light hairlines */
.hero,.foot,.dash-head{border-color:var(--line)}
.hero{border-bottom:1px solid var(--line);
  background:radial-gradient(1000px 520px at 20% -12%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%)}
.foot{border-top:1px solid var(--line)}
.dash-head{border-bottom:1px solid var(--line)}

/* clan hero: dark band with a cinematic colour glow (not a flat fill) */
.clan-hero{
  background:
    radial-gradient(90% 150% at 82% -10%, color-mix(in srgb, var(--glow) 46%, transparent), transparent 60%),
    radial-gradient(80% 140% at 6% 120%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 62%),
    linear-gradient(180deg, #0c0e16, #090a0f);
  border-bottom:1px solid var(--line)}
.clan-hero h1{color:#fff; text-shadow:0 4px 50px color-mix(in srgb, var(--glow) 50%, transparent)}
.clan-hero .el{color:color-mix(in srgb, var(--glow) 78%, #fff)}
.clan-glyph{opacity:.16; filter:drop-shadow(0 0 40px color-mix(in srgb, var(--glow) 60%, transparent))}

/* cards glow on the dark field */
.ccard{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent)}
.ccard .thumb{background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 12%, var(--surface-3)), var(--surface))}
.ccard:hover{border-color:var(--accent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 34px 64px -26px color-mix(in srgb, var(--accent) 55%, #000)}
.ccard .num,.ccard .thumb .imgcount{background:rgba(0,0,0,.55)}

/* clan tiles: glowing edge + accent halo */
.clan-tile{background:var(--surface); border-color:var(--line)}
.clan-tile:hover{border-color:var(--taccent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--taccent) 40%, transparent), 0 34px 60px -24px color-mix(in srgb, var(--taccent) 55%, #000)}
.clan-tile .tglyph{filter:drop-shadow(0 0 12px color-mix(in srgb, var(--taccent) 60%, transparent))}

/* spectrum bar glows */
.spectrum{box-shadow:0 0 34px -6px rgba(110,166,255,.45); height:8px}

/* section rules + eyebrows read on dark */
.tier-head .line{background:linear-gradient(90deg, var(--line-2), transparent)}
.hero h1 em{font-weight:500}

/* storage banner on dark */
.mem-banner{background:rgba(255,196,84,.08); border-color:rgba(255,196,84,.32); color:#f0cf94}

/* admin/artist chips + tags on dark */
.uw-role.admin{color:#ffd98a; border-color:rgba(255,196,84,.4); background:rgba(255,196,84,.08)}
.uw-ava{color:#0a0b10}
.done-badge,.done-chip{color:#0c1707}
.admin-bar .dot{box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 26%, transparent)}

/* inputs glow on focus */
.field input:focus,.field select:focus,.field textarea:focus,.search:focus-within,.panel input:focus{
  border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
.search{background:var(--surface-2); border-color:var(--line)}

/* modal crown glows */
.modal{border-top:4px solid var(--accent); box-shadow:0 0 0 1px var(--line), 0 50px 100px -30px #000}
.modal-back{background:rgba(4,5,8,.72)}

/* buttons: primary is a bright chip on dark */
.btn{background:var(--ink); color:#0a0b10; border-color:var(--ink)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:#06131f;
  box-shadow:0 12px 26px -14px color-mix(in srgb, var(--accent) 90%, transparent)}
.chip{background:var(--surface-2); border-color:var(--line)}

/* ============================================================ REMOVE DECORATIVE DASHES */
.eyebrow::before,
.hero .studio::before,
.clan-hero .el::before{display:none}
.eyebrow{gap:0}
.hero .studio{gap:0}
.clan-hero .el{gap:0}

/* ============================================================ LANDING + CLAN LIGHT TWEAKS */
/* remove the divider under the landing hero */
.hero{border-bottom:none}
/* landing page: a touch brighter than the rest */
body.on-home{background-color:#0e1019; background-image:
  radial-gradient(1100px 660px at 20% -12%, rgba(120,170,255,.18), transparent 60%),
  radial-gradient(920px 540px at 100% -2%, rgba(150,140,255,.12), transparent 55%);}
body.on-home .hero{
  background:radial-gradient(1000px 540px at 22% -14%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%)}

/* ============================================================ BRIGHTER LANDING + CLEAN CHAPTER TILES */
/* landing clearly lighter than inner pages */
body.on-home{background-color:#1b1f2b; background-image:
  radial-gradient(1100px 680px at 20% -14%, rgba(130,175,255,.22), transparent 62%),
  radial-gradient(940px 560px at 100% -4%, rgba(160,150,255,.14), transparent 56%);}
body.on-home .hero{background:radial-gradient(1000px 560px at 24% -16%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 60%)}

/* clan pages stay lit but a touch lighter base */
body.on-clan{background-color:#12141d}

/* chapter tiles: one clean colour, no top colour bar, very faint icon */
.clan-tile::before{display:none}
.clan-tile{padding-top:22px;
  background:linear-gradient(158deg, color-mix(in srgb, var(--taccent) 17%, var(--surface)), color-mix(in srgb, var(--taccent) 5%, var(--surface)));
  border:1px solid color-mix(in srgb, var(--taccent) 26%, var(--line))}
.clan-tile:hover{border-color:color-mix(in srgb, var(--taccent) 55%, var(--line))}
.clan-tile .tglyph{opacity:.09; filter:none}

/* ============================================================ REMOVE BTN · VIEW TOGGLE · GRID · GLITCH */
/* smaller remove */
.btn.xs{padding:4px 9px; font-size:12px; border-radius:16px; line-height:1}
.btn.danger.xs{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, var(--line-2))}
.btn.danger.xs:hover{background:color-mix(in srgb, var(--danger) 14%, transparent)}

/* list / grid toggle */
.viewtoggle{display:inline-flex; border:1px solid var(--line-2); border-radius:20px; overflow:hidden; background:var(--surface)}
.viewtoggle .vt{background:transparent; border:0; color:var(--ink-2); font-family:var(--mono); font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; cursor:pointer; transition:background .15s,color .15s}
.viewtoggle .vt.on{background:var(--accent); color:#06131f}

/* dashboard grid cards */
.dcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px}
.dcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column;
  transition:border-color .15s, box-shadow .15s}
.dcard:hover{border-color:var(--accent); box-shadow:0 20px 44px -26px color-mix(in srgb, var(--accent) 50%, #000)}
.dcard.done{border-color:var(--done)}
.dcard-thumb{aspect-ratio:4/3; background:radial-gradient(circle at 50% 34%, var(--surface-3), var(--surface));
  position:relative; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:28px; color:var(--bark)}
.dcard-thumb img{width:100%; height:100%; object-fit:cover}
.dcard-thumb .done-badge{position:absolute; top:6px; right:6px; left:auto; transform:none; font-size:9px; padding:2px 7px}
.dcard-thumb .imgcount{position:absolute; left:6px; bottom:6px; font-family:var(--mono); font-size:9px; background:rgba(0,0,0,.6); color:#fff; padding:2px 6px; border-radius:10px}
.dcard-body{padding:10px 11px 8px; display:flex; flex-direction:column; gap:6px; flex:1}
.dcard-body b{font-family:var(--display); font-weight:600; font-size:15px; line-height:1.12; color:var(--ink)}
.dcard-act{display:flex; gap:6px; align-items:center; padding:0 11px 11px; flex-wrap:wrap}

/* glitch heading */
.glitch{position:relative; display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text); position:absolute; left:0; top:0; width:100%; overflow:hidden; pointer-events:none; white-space:nowrap}
.glitch::before{color:#54d6ff; mix-blend-mode:screen; animation:glitch-a 3s infinite steps(2,end)}
.glitch::after{color:#ff4d7d; mix-blend-mode:screen; animation:glitch-b 3.4s infinite steps(2,end)}
@keyframes glitch-a{
  0%,90%,100%{transform:translate(-2px,0); clip-path:inset(0 0 62% 0)}
  91%{transform:translate(-5px,-1px); clip-path:inset(8% 0 40% 0)}
  94%{transform:translate(3px,1px); clip-path:inset(42% 0 22% 0)}
  97%{transform:translate(-3px,0); clip-path:inset(20% 0 55% 0)}
}
@keyframes glitch-b{
  0%,88%,100%{transform:translate(2px,0); clip-path:inset(62% 0 0 0)}
  89%{transform:translate(5px,1px); clip-path:inset(48% 0 8% 0)}
  93%{transform:translate(-3px,-1px); clip-path:inset(34% 0 30% 0)}
  96%{transform:translate(3px,0); clip-path:inset(56% 0 4% 0)}
}
@media (prefers-reduced-motion:reduce){ .glitch::before,.glitch::after{display:none} }

/* ============================================================ WIDE CLAN LAYOUT (6-up grid) */
.wrap.wide{max-width:1580px}

/* ============================================================ MULTI-SELECT + PER-ROW SPRINT */
.row .rthumb, .dcard-thumb{position:relative}
.selbox{position:absolute; top:3px; left:3px; z-index:2; margin:0; cursor:pointer;
  background:rgba(8,9,13,.6); border-radius:5px; padding:2px; line-height:0}

.mini-sprint{font-family:var(--mono); font-size:11px; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:8px; padding:5px 6px; cursor:pointer}
.mini-sprint:focus{border-color:var(--accent); outline:none}

.goal-inp{width:56px; font-family:var(--mono); font-size:12px; background:var(--surface); color:var(--ink);
  border:1px solid var(--line-2); border-radius:6px; padding:3px 6px}
.goal-inp:focus{border-color:var(--accent); outline:none}

.bulkbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface-2);
  border:1px solid var(--line); border-radius:12px; padding:8px 13px; margin-bottom:12px}
.bulkbar .selall{font-family:var(--mono); font-size:11px; color:var(--ink-2); display:flex; align-items:center; gap:7px; cursor:pointer}
.bulkbar .selall input{accent-color:var(--accent); width:15px; height:15px}
.bulk-total{font-family:var(--mono); font-size:10.5px; color:var(--bark)}
.bulk-count{font-family:var(--mono); font-size:10.5px; color:var(--bark)}
.bulk-count.on{color:var(--accent)}
.bulk-actions{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-left:auto}

.row.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent)}
.dcard.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent)}

/* ============================================================ SPRINT MANAGER + GENDER/HEIGHT + ANALYTICS */
.sprint-rows{display:grid; gap:8px}
.sprint-row{display:flex; align-items:center; gap:10px}
.sprint-row .sp-name{flex:1; font-family:var(--body); font-size:13.5px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; padding:8px 11px; outline:none}

/* analytics panel */
.analytics h3{margin:0 0 14px}
.an-top{display:flex; gap:24px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.an-big{display:flex; align-items:center; gap:16px}
.an-ring{width:96px; height:96px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface-3) 0); position:relative}
.an-ring::before{content:""; position:absolute; inset:9px; border-radius:50%; background:var(--surface)}

.an-lab{font-family:var(--body); font-size:13.5px; color:var(--ink-2)}

.an-stage{display:grid; grid-template-columns:78px 1fr auto; align-items:center; gap:10px}

.an-cols{display:grid; grid-template-columns:1fr 1fr; gap:22px}
@media (max-width:760px){.an-cols{grid-template-columns:1fr}}
.an-col h4{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--bark); margin:0 0 10px}
.an-row{display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:10px; margin-bottom:8px}
.an-row-lab{font-family:var(--body); font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ============================================================ FULLSCREEN IMAGE LIGHTBOX */
.gal-main{position:relative}
.gal-main img{cursor:zoom-in}
.gal-expand{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:9px; background:rgba(8,9,13,.6);
  color:#fff; border:1px solid rgba(255,255,255,.25); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; z-index:2}
.gal-expand:hover{background:rgba(8,9,13,.85); border-color:var(--accent)}

.lightbox{position:fixed; inset:0; z-index:200; background:rgba(4,5,8,.93); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center}
.lb-stage{width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden}
.lb-img{max-width:92vw; max-height:86vh; user-select:none; -webkit-user-drag:none; transition:transform .07s linear;
  will-change:transform; box-shadow:0 30px 90px rgba(0,0,0,.65); border-radius:6px}
.lb-close{position:fixed; top:18px; right:20px; z-index:3; width:42px; height:42px; border-radius:50%; background:var(--surface-2);
  color:var(--ink); border:1px solid var(--line-2); font-size:15px; cursor:pointer}
.lb-close:hover{border-color:var(--accent)}
.lb-nav{position:fixed; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; background:var(--surface-2);
  color:var(--ink); border:1px solid var(--line-2); font-size:24px; line-height:1; cursor:pointer; z-index:3}
.lb-prev{left:20px} .lb-next{right:20px}
.lb-nav:hover{border-color:var(--accent)}
.lb-tools{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:24px; padding:8px 14px; z-index:3;
  font-family:var(--mono); font-size:12px; color:var(--ink-2)}
.lb-tools button{width:28px; height:28px; border-radius:50%; background:var(--surface-3); color:var(--ink);
  border:1px solid var(--line-2); cursor:pointer; font-size:14px; line-height:1}
.lb-tools button[data-z=reset]{width:auto; border-radius:14px; padding:0 12px; font-size:11px}
.lb-tools button:hover{border-color:var(--accent)}

.lb-count{margin-left:6px; color:var(--ink-2)}
.lb-hint{margin-left:10px; color:var(--bark); font-size:10.5px}
@media (max-width:640px){.lb-hint{display:none}}

/* ============================================================ ALIGNMENT / GAP FIXES */
/* footer aligns with the wide clan layout */
body.on-clan .foot{max-width:1580px}
/* keep empty dashboard panel mounts from adding stray gaps */
#analyticsMount:empty, #settingsMount:empty, #pwMount:empty{display:none}
/* editor selects/inputs share the same height for tidy rows */
.field select, .field input{min-height:38px}
.grid2, .grid3{align-items:end}

/* ============================================================ REVIEWS · SPRINT DATES · SECURITY */
/* review block in editor */
.rev-box{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.rev-badge{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:20px; border:1px solid var(--line-2); color:var(--ink-2)}
.rev-badge.none{color:var(--bark)}
.rev-badge.in_review{color:#ffd98a; border-color:rgba(255,196,84,.4); background:rgba(255,196,84,.08)}
.rev-badge.approved{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); background:color-mix(in srgb,var(--ok) 12%,transparent)}

.rev-btns{display:flex; gap:7px; margin-left:auto; flex-wrap:wrap}

.rev-mini{font-family:var(--mono); font-size:9.5px; letter-spacing:.03em; padding:1px 6px; border-radius:10px; margin-left:7px;
  border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap; vertical-align:middle}
.rev-mini.approved{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.rev-mini.rejected{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.rev-mini.in_review{color:#ffce7a; border-color:rgba(255,196,84,.4)}

/* sprint dates */
.sprint-dates{font-family:var(--mono); font-size:11px; color:var(--accent); margin-left:12px; white-space:nowrap}
.sprint-row .sp-date{font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:8px; padding:6px 8px; width:130px}
.sprint-row .sp-date:focus{border-color:var(--accent); outline:none}
.sprint-row{flex-wrap:wrap}

/* analytics tiles */
.an-tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px}

.an-tile{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.an-tile b{display:block; font-family:var(--display); font-weight:700; font-size:24px; color:var(--ink); line-height:1}

.filt{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2)}

  <script>
/* ============================================================
   CHARACTER CODEX — application logic (classic script, file:// safe)
   Storage: IndexedDB with graceful localStorage / in-memory fallback.
   ============================================================ */
(function(){
'use strict';

var CLAN_META=window.CLAN_META, GLOSS=window.ABILITY_GLOSSARY||{};
var CLAN_ORDER=['aranyani','vulcanis','oceanis','noctari','forsaken','synthara'];
var ARCHES=['Tank','DPS','Assassin','Support','Control'];
var TYPES=['Melee','Archer','Magic'];
var DEFAULT_SPRINTS=[{n:1,name:'Priority release'},{n:2,name:'Second sprint'},{n:3,name:'Third sprint'},{n:4,name:'Fourth sprint'}];
var DEFAULT_HOME={
  studio:'Etta Global Partners LLC · Game Development',
  title:'Character', titleEm:'Codex',
  intro:'The living compendium of every unit across {clans} clans — grouped by release sprint, with production tracking and art managed from the dashboard.',
  showStats:true,
  eyebrow:'The Clans',
  chapterTitle:'Choose a chapter',
  chapterSub:'Each clan carries its element\u2019s colour. Open one to see its release sprints.'
};
var HOME_TEXT={};for(var _hk in DEFAULT_HOME)HOME_TEXT[_hk]=DEFAULT_HOME[_hk];
function homeCounts(){var art=0,done=0;CHARS.forEach(function(c){if((IMAGES[c.id]||[]).length)art++;if(statusDone(c)===4)done++;});return{units:CHARS.length,clans:CLAN_ORDER.length,sprints:SPRINT_DEFS.length,art:art,done:done};}
function fillTokens(str){var c=homeCounts();return String(str==null?'':str).replace(/\{units\}/g,c.units).replace(/\{clans\}/g,c.clans).replace(/\{sprints\}/g,c.sprints).replace(/\{art\}/g,c.art).replace(/\{done\}/g,c.done);}
function saveHome(){return setSetting('homeText',HOME_TEXT);}
var SPRINT_DEFS=DEFAULT_SPRINTS.slice();
function sprintNums(){return SPRINT_DEFS.map(function(s){return s.n;});}
function sprintName(n){for(var i=0;i<SPRINT_DEFS.length;i++)if(SPRINT_DEFS[i].n===n)return SPRINT_DEFS[i].name;return 'Sprint '+n;}
function sprintDef(n){for(var i=0;i<SPRINT_DEFS.length;i++)if(SPRINT_DEFS[i].n===n)return SPRINT_DEFS[i];return null;}
function fmtD(d){if(!d)return '';var p=String(d).split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+p[0].slice(2)):d;}
var MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtTS(ts){if(!ts)return '';var d=new Date(ts);var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM',h12=h%12||12;
  return MONTHS_SHORT[d.getMonth()]+' '+d.getDate()+', '+h12+':'+(m<10?'0':'')+m+ap;}
function sprintDates(n){var s=sprintDef(n);if(!s||(!s.start&&!s.end))return '';if(s.start&&s.end)return fmtD(s.start)+' \u2013 '+fmtD(s.end);return fmtD(s.start||s.end);}
function firstSprint(){return (SPRINT_DEFS[0]&&SPRINT_DEFS[0].n)||1;}
function lastSprint(){return (SPRINT_DEFS.length?SPRINT_DEFS[SPRINT_DEFS.length-1].n:firstSprint());}
function saveSprints(){return setSetting('sprints',SPRINT_DEFS);}
// A sprint only "ends" once it has an end date that's in the past — a sprint
// with no end date set never auto-archives anything.
function sprintEnded(n){var s=sprintDef(n);return !!(s&&s.end&&new Date(s.end+'T23:59:59')<new Date());}
/* ---------- archiving finished work once its sprint has wrapped ----------
   A completed task/character whose sprint has ended quietly drops out of the
   default Tasks views so the list doesn't pile up with old finished work —
   but it's never gone: explicitly filtering to that sprint, or searching for
   it (by its own name, category or its sprint's name), brings it right back.
   Applies only to the Tasks views (allTaskLikeEntries) — the Roster and clan
   pages keep showing every character regardless of sprint or completion. */
function isArchivedTask(t){return isDone(t)&&sprintEnded(t.sprint||1);}
/* ---------- artist sprint goals/scores ---------- */
// Each artist's goal is 3.5 completed characters per sprint = a 100 score.
// Some sprints hand an artist harder (complex) characters, so the goal for a
// given artist + sprint can be overridden (e.g. down to 3) rather than
// hard-coding one number for everyone — the score formula itself never
// changes: completed / goal * 100.
var DEFAULT_ARTIST_GOAL=3.5;
var ARTIST_GOALS={};
function goalFor(sprintN,artist){var row=ARTIST_GOALS[sprintN];var g=row?row[artist]:null;return(g!=null&&g!=='')?Number(g):DEFAULT_ARTIST_GOAL;}
function saveArtistGoals(){return setSetting('artistGoals',ARTIST_GOALS);}
function setArtistGoal(sprintN,artist,val){
  if(val==null||val===''||isNaN(val)){if(ARTIST_GOALS[sprintN]){delete ARTIST_GOALS[sprintN][artist];if(!Object.keys(ARTIST_GOALS[sprintN]).length)delete ARTIST_GOALS[sprintN];}}
  else{ARTIST_GOALS[sprintN]=ARTIST_GOALS[sprintN]||{};ARTIST_GOALS[sprintN][artist]=Number(val);}
  return saveArtistGoals();}
function artistScoresFor(sprintN){var counts={};userNames().forEach(function(n){counts[n]=0;});
  CHARS.forEach(function(c){if((c.sprint||1)!==sprintN||!isDone(c))return;
    var credited={};var mb=modeledOf(c),tb=texturedOf(c);if(mb)credited[mb]=1;if(tb)credited[tb]=1;
    Object.keys(credited).forEach(function(n){counts[n]=(counts[n]||0)+1;});});
  return Object.keys(counts).sort().map(function(n){var done=counts[n],goal=goalFor(sprintN,n);
    return{name:n,done:done,goal:goal,score:goal>0?Math.round(done/goal*100):0,overridden:!!(ARTIST_GOALS[sprintN]&&ARTIST_GOALS[sprintN][n]!=null)};});}

// A character's personal weapon image rides in the same IMAGES store/endpoint
// as its gallery art (one fewer moving part on the server), tagged kind:'weapon'

function galleryImages(id){return (IMAGES[id]||[]).filter(function(im){return im.kind!=='weapon';});}

// Names that still sit on some character/task assignment but belong to no
// one in the current team list — almost always leftovers from a rename that
// didn't fully reach every record (the old client-only rename, or a record
// added/edited while offline). Surfaced in Security so an admin can merge
// them into whoever they should actually be, instead of them lingering
// forever in Analytics/Scores under a name nobody can pick anymore.
function strayNames(){var known={};userNames().forEach(function(n){known[n]=1;});
  var counts={};function bump(n){if(!n||known[n])return;counts[n]=(counts[n]||0)+1;}
  CHARS.forEach(function(c){bump(c.modeledBy);bump(c.texturedBy);});
  TASKS.forEach(function(t){bump(t.modeledBy);bump(t.texturedBy);});
  return Object.keys(counts).sort().map(function(n){return{name:n,count:counts[n]};});}

/* ---------- pinning an existing clan character into Tasks ----------
   A character "added to Tasks" is never copied — it's the exact same
   CHARS record, just flagged with pinnedToTasks:true so it also shows up
   in the Tasks views. Every generic helper above (modeledOf, isDone,
   statusOf, reviewOf, primaryOf…) already reads only fields characters
   and tasks share, so a pinned character slots into the Tasks list and
   filters with no translation layer — and since every edit still goes
   through putChar()/the real character editor, the clan page and the

/* ============================================================ STORAGE (server-backed via Netlify Functions + Blobs) */
/* Everyone who opens this site shares one roster now: reads are public, writes
   need a signed-in session (see AUTH below). REMOTE mirrors the server; the
   putChar/delChar/putImg/delImg/getSetting/setSetting/allOf functions below
   keep the exact same call signatures the rest of the app already uses. */
var REMOTE={characters:[],tasks:[],images:[],settings:{}};

function currentToken(){return CURRENT_USER===ADMIN_NAME?adminTokenGet():userTokenGet(CURRENT_USER);}
function api(path,opts){opts=opts||{};var headers=opts.headers||{};var tk=currentToken();if(tk)headers['Authorization']='Bearer '+tk;
  var body=opts.body;if(body&&typeof body!=='string'){headers['Content-Type']='application/json';body=JSON.stringify(body);}
  return fetch('/api/'+path,{method:opts.method||'GET',headers:headers,body:body}).then(function(r){
    if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){var e=new Error(j.error||('Request failed ('+r.status+')'));e.status=r.status;throw e;});
    return r.status===204?null:r.json();
  });}
function refreshRemote(){return api('bootstrap').then(function(d){MEM=false;REMOTE.characters=d.characters||[];REMOTE.tasks=d.tasks||[];REMOTE.images=d.images||[];REMOTE.settings=d.settings||{};});}
function openDB(){return refreshRemote().catch(function(e){MEM=true;toast('Could not reach the server — check your connection');throw e;});}
function upsertLocal(store,row){var arr=REMOTE[store];var i=arr.findIndex(function(x){return x.id===row.id;});if(i>=0)arr[i]=row;else arr.push(row);}
function putChar(c){return api('characters',{method:'POST',body:c}).then(function(saved){upsertLocal('characters',saved);return saved;});}
function delChar(id){return api('characters?id='+encodeURIComponent(id),{method:'DELETE'}).then(function(){REMOTE.characters=REMOTE.characters.filter(function(x){return x.id!==id;});});}
function putTask(t){return api('tasks',{method:'POST',body:t}).then(function(saved){upsertLocal('tasks',saved);return saved;});}
function delTask(id){return api('tasks?id='+encodeURIComponent(id),{method:'DELETE'}).then(function(){REMOTE.tasks=REMOTE.tasks.filter(function(x){return x.id!==id;});});}
function putImg(im){return api('images',{method:'POST',body:im}).then(function(saved){upsertLocal('images',saved);return saved;});}
function delImg(id){return api('images?id='+encodeURIComponent(id),{method:'DELETE'}).then(function(){REMOTE.images=REMOTE.images.filter(function(x){return x.id!==id;});});}
function allOf(store){return Promise.resolve((REMOTE[store]||[]).slice());}
function getSetting(key){return Promise.resolve(REMOTE.settings[key]!=null?REMOTE.settings[key]:null);}
function setSetting(key,value){if(key==='auth')return Promise.reject(new Error('use the auth endpoints for the admin password'));
  return api('settings',{method:'POST',body:{key:key,value:value}}).then(function(){REMOTE.settings[key]=value;});}

function loadCaches(){
  CHARS=REMOTE.characters.slice();CHARS.sort(function(a,b){var ci=CLAN_ORDER.indexOf(a.clan)-CLAN_ORDER.indexOf(b.clan);return ci||a.num-b.num;});
  TASKS=REMOTE.tasks.slice();TASKS.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
  IMAGES={};REMOTE.images.forEach(function(im){(IMAGES[im.charId]=IMAGES[im.charId]||[]).push(im);});
  for(var k in IMAGES)IMAGES[k].sort(function(a,b){return a.ts-b.ts;});
  return Promise.resolve();}

  updatedAt:new Date(c.updatedAt||Date.now()).toISOString()};
  if(withImg){var p=primaryOf(c);o.image=p?p.data:'';}
  return o;}
function syncUpsert(c){return sheetPost({action:'upsert',character:flat(c,true)});}
function syncDelete(id,clanKey){return sheetPost({action:'delete',id:id,clanName:clanNameOf(clanKey)});}
function syncAll(){if(!SHEET_URL){toast('Add your Apps Script URL first');return;}
  var all=CHARS.slice(),chunk=10,i=0;toast('Pushing '+all.length+' rows (with images) across '+CLAN_ORDER.length+' clan tabs\u2026');
  (function next(){if(i>=all.length){toast('Pushed all rows to your sheet');return;}
    var part=all.slice(i,i+chunk);i+=chunk;
    sheetPost({action:'bulk',characters:part.map(function(c){return flat(c,true);})}).then(function(){setTimeout(next,350);});
  })();}
function sheetPost(payload){
  if(!SHEET_URL)return Promise.resolve(false);
  try{return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(){return true;}).catch(function(){return false;});}
  catch(e){return Promise.resolve(false);}
}

/* ============================================================ AUTH (server-verified sessions) */
/* HAS_ADMIN_PW / AUTHED mirror the server's truth (fetched via bootstrap /
   auth endpoints). The admin's token lives for this browser SESSION only
   (must re-enter the password each new session, like before); a regular
   teammate's token persists like their name already did. Either way the
   SERVER re-checks every write — a name picked in the UI is not itself proof
   of anything. */
var HAS_ADMIN_PW=false, AUTHED=false, failCount=0, lockUntil=0;
function adminTokenGet(){try{return sessionStorage.getItem('codex_admin')||'';}catch(e){return '';}}
function adminTokenSet(t){try{t?sessionStorage.setItem('codex_admin',t):sessionStorage.removeItem('codex_admin');}catch(e){}}
function userTokenGet(name){try{var s=localStorage.getItem('codex_utoken');if(!s)return '';var o=JSON.parse(s);if(o.name!==name)return '';if(o.exp&&Date.now()>o.exp)return '';return o.token||'';}catch(e){return '';}}
function userTokenSet(name,token,exp){try{token?localStorage.setItem('codex_utoken',JSON.stringify({name:name,token:token,exp:exp})):localStorage.removeItem('codex_utoken');}catch(e){}}
function decodeToken(t){if(!t)return null;try{var seg=t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');var payload=JSON.parse(decodeURIComponent(escape(atob(seg))));if(payload.exp&&Date.now()>payload.exp)return null;return payload;}catch(e){return null;}}
function randSalt(){var a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);return Array.prototype.map.call(a,function(b){return('0'+b.toString(16)).slice(-2);}).join('');}
function simpleHash(s){var hh=5381;for(var i=0;i<s.length;i++)hh=((hh<<5)+hh)^s.charCodeAt(i);return 'x'+(hh>>>0).toString(16);}
function hashPw(pw,salt){if(window.crypto&&crypto.subtle&&crypto.subtle.digest){var d=new TextEncoder().encode(salt+'|'+pw);
  return crypto.subtle.digest('SHA-256',d).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2);}).join('');}).catch(function(){return simpleHash(salt+'|'+pw);});}
  return Promise.resolve(simpleHash(salt+'|'+pw));}

/* ============================================================ TEAM USER (corner login) */
function userGet(){try{return localStorage.getItem('codex_user')||'';}catch(e){return CURRENT_USER;}}

  var menu=el('uwMenu');
  menu.innerHTML='<div class="uw-head">Sign in as</div>'
    +USERS.map(function(u){var lk=(u.name!==ADMIN_NAME&&u.hash)?' \ud83d\udd12':'';return '<button class="uw-item'+(u.name===CURRENT_USER?' active':'')+'" data-user="'+esc(u.name)+'"><span class="uw-ava sm">'+esc(initials(u.name))+'</span><span style="flex:1">'+esc(u.name)+lk+'</span><span class="uw-mini">'+esc(u.name===ADMIN_NAME?'Admin':u.role)+'</span></button>';}).join('')
    +'<div class="uw-sep"></div>'
    +(CURRENT_USER?'<button class="uw-item" data-user="">Sign out</button>':'')

  el('uwBtn').addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('hidden');});
  document.addEventListener('click',function(){menu.classList.add('hidden');});
  menu.addEventListener('click',function(e){e.stopPropagation();});
  menu.querySelectorAll('[data-user]').forEach(function(b){b.addEventListener('click',function(){pickUser(b.getAttribute('data-user'));menu.classList.add('hidden');});});
  var mg=el('uwManage');if(mg)mg.addEventListener('click',function(){menu.classList.add('hidden');dashTab='security';if(location.hash.indexOf('dashboard')<0)location.hash='#/dashboard';else renderDashboard();});
}
function pickUser(u){
  if(u===''){AUTHED=false;adminTokenSet('');userTokenSet('','');userSetLS('');pendingUser='';renderUserWidget();toast('Signed out');route();return;}
  if(u===ADMIN_NAME){if(CURRENT_USER===ADMIN_NAME&&AUTHED){renderUserWidget();return;}
    userSetLS(ADMIN_NAME);AUTHED=false;adminTokenSet('');pendingUser='';renderUserWidget();
    if(location.hash.indexOf('dashboard')<0)location.hash='#/dashboard';else route();return;}
  var user=findUser(u);
  if(user&&user.hash){userSetLS('');pendingUser=u;renderUserWidget();if(location.hash.indexOf('dashboard')<0)location.hash='#/dashboard';else route();return;}
  userSetLS(u);pendingUser='';renderUserWidget();toast('Signing in…');
  api('auth/login',{method:'POST',body:{name:u}}).then(function(r){userTokenSet(u,r.token,Date.now()+29*24*3600*1000);toast('Signed in as '+u);route();}).catch(function(){toast('Signed in as '+u+' (offline — changes may not save)');route();});
}

function route(){stopParticles();document.body.classList.remove('on-home');var hash=location.hash.replace(/^#/,'')||'/';var p=hash.split('/').filter(Boolean);
  setActiveNav(p[0]||'home');
  if(p[0]==='clan'&&p[1])return renderClan(p[1]);
  if(p[0]==='tasks')return renderTasksPage();
  if(p[0]==='dashboard')return renderDashboard();
  if(p[0]==='pipeline')return renderPipeline();
  return renderHome();}

/* ============================================================ PARTICLES (simple, calm) */
function simpleCfg(c1,c2){return {colors:[c1,c2],mesh:false,dir:'drift',
  count:46,size:[1.4,3.2],alpha:[.32,.62],vx:[-.11,.11],vy:[-.11,.11],sway:[.05,.14],shape:'circle',glow:true};}
var PARTICLE_CFG={
  home:    simpleCfg('#8ab4ff','#a9c6ff'),
  aranyani:simpleCfg('#7ecb86','#bfe8c2'),
  vulcanis:simpleCfg('#ffb968','#ff9a6c'),
  oceanis: simpleCfg('#7fd4ec','#c3ecfb'),
  noctari: simpleCfg('#e6c583','#f2dca8'),
  forsaken:simpleCfg('#c3d17a','#e6e2c6'),
  synthara:simpleCfg('#7fe6f0','#c9f7fb')
};
var activeParticles=null;
function stopParticles(){if(activeParticles){activeParticles.stop();activeParticles=null;}}
function startParticles(sel,cfg){
  if(!cfg)return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var container=document.querySelector(sel);if(!container)return;
  activeParticles=makeParticles(container,cfg);
}
function makeParticles(container,cfg){
  var canvas=document.createElement('canvas');canvas.className='particle-canvas';
  container.insertBefore(canvas,container.firstChild);
  var ctx=canvas.getContext('2d');var dpr=Math.min(window.devicePixelRatio||1,2);
  var W=0,H=0,parts=[],raf=null,running=true;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function resize(){var r=container.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
    canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  function spawn(seed){return{x:rnd(0,W),y:seed?rnd(0,H):(cfg.dir==='up'?H+8:cfg.dir==='down'?-8:rnd(0,H)),
    r:rnd(cfg.size[0],cfg.size[1]),a:rnd(cfg.alpha[0],cfg.alpha[1]),
    vx:rnd(cfg.vx[0],cfg.vx[1]),vy:rnd(cfg.vy[0],cfg.vy[1]),
    color:cfg.colors[(Math.random()*cfg.colors.length)|0],phase:rnd(0,6.28),
    sway:rnd(cfg.sway[0],cfg.sway[1]),tw:rnd(.6,1)};}
  function init(){parts=[];var n=Math.min(cfg.count,Math.round(W/12)+10);for(var i=0;i<n;i++)parts.push(spawn(true));}
  function step(t){if(!running)return;ctx.clearRect(0,0,W,H);
    var i,p;
    for(i=0;i<parts.length;i++){p=parts[i];
      p.x+=p.vx+Math.sin(t/1000+p.phase)*p.sway*0.35;p.y+=p.vy;
      if(p.y<-14){p.y=H+8;p.x=rnd(0,W);}else if(p.y>H+14){p.y=-8;p.x=rnd(0,W);}
      if(p.x<-14)p.x=W+8;else if(p.x>W+14)p.x=-8;}
    if(cfg.mesh){var D=124,D2=D*D;ctx.lineWidth=1;ctx.shadowBlur=0;
      for(i=0;i<parts.length;i++){var a=parts[i];
        for(var j=i+1;j<parts.length;j++){var bp=parts[j];var dx=a.x-bp.x,dy=a.y-bp.y,d2=dx*dx+dy*dy;
          if(d2<D2){var al=(1-d2/D2)*0.5;ctx.strokeStyle='rgba('+cfg.line+','+al.toFixed(3)+')';
            ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(bp.x,bp.y);ctx.stroke();}}}}
    for(i=0;i<parts.length;i++){p=parts[i];
      ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.color;
      if(cfg.glow){ctx.shadowColor=p.color;ctx.shadowBlur=p.r*2.6;}else{ctx.shadowBlur=0;}
      if(cfg.shape==='square'){ctx.fillRect(p.x,p.y,p.r*1.6,p.r*1.6);}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;raf=requestAnimationFrame(step);
  }
  resize();init();
  var ro=window.ResizeObserver?new ResizeObserver(function(){resize();init();}):null;
  if(ro)ro.observe(container);else window.addEventListener('resize',resizeHandler);
  function resizeHandler(){resize();init();}
  raf=requestAnimationFrame(step);
  return{stop:function(){running=false;if(raf)cancelAnimationFrame(raf);if(ro)ro.disconnect();else window.removeEventListener('resize',resizeHandler);if(canvas.parentNode)canvas.parentNode.removeChild(canvas);}};
}
