    +'<div class="clan-glyph">'+clanGlyph(clanId)+'</div></div></header>'
    +'<div class="clan-switch-wrap"><div class="wrap wide"><div class="clan-switch">'+switcher+'</div></div></div>'
    +'<main class="wrap wide">'+memBanner()
    +'<div class="filters"><div class="search"><span class="mono" style="color:var(--bark)">\u2315</span><input id="clanSearch" type="search" placeholder="Search '+esc(m.name)+' units, abilities\u2026"></div>'
    +'<label class="filt"><span>Modeler</span><select id="clanModeler" class="filt-sel">'+modelerOpts+'</select></label>'
    +'<label class="filt"><span>Texturer</span><select id="clanTexturer" class="filt-sel">'+texturerOpts+'</select></label></div>'
    +'<div class="filters" style="padding-top:0"><div class="chipset">'+sprintChips+'</div></div>'
    +'<div class="filters" style="padding-top:0"><div class="chipset">'+archChips+'</div><div class="chipset">'+typeChips+'</div></div>'
    +'<div class="count-note" id="clanCount"></div><div id="clanBody"></div></main>'+footer();
  el('clanSearch').addEventListener('input',function(){clanState.search=this.value.toLowerCase();paintClan();});
  el('clanModeler').addEventListener('change',function(){clanState.modeler=this.value;paintClan();});
  el('clanTexturer').addEventListener('change',function(){clanState.texturer=this.value;paintClan();});
  bindChips('[data-sprint]','sprint',function(v){return v;});
  bindChips('[data-arch]','arch');bindChips('[data-type]','type');
  paintClan();startParticles('.clan-hero',PARTICLE_CFG[clanId]);window.scrollTo(0,0);}
function bindChips(sel,key,map){APP.querySelectorAll(sel).forEach(function(b){b.addEventListener('click',function(){
  var raw=b.getAttribute('data-'+key);var v=map?map(raw):raw;clanState[key]=(String(clanState[key])===String(v)?'':v);
  APP.querySelectorAll(sel).forEach(function(x){x.setAttribute('aria-pressed',String(clanState[key])===String(x.getAttribute('data-'+key))?'true':'false');});paintClan();});});}
function matchClan(c){if(clanState.arch&&c.arch!==clanState.arch)return false;if(clanState.type&&c.type!==clanState.type)return false;
  if(clanState.sprint&&String(c.sprint)!==String(clanState.sprint))return false;
  if(clanState.modeler&&modeledOf(c)!==clanState.modeler)return false;
  if(clanState.texturer&&texturedOf(c)!==clanState.texturer)return false;
  if(clanState.search){var s=clanState.search;if(c.name.toLowerCase().indexOf(s)<0&&c.abilities.join(' ').toLowerCase().indexOf(s)<0&&c.arch.toLowerCase().indexOf(s)<0)return false;}return true;}
function paintClan(){var list=CHARS.filter(function(c){return c.clan===clanState.clan&&matchClan(c);});
  el('clanCount').textContent=list.length+' of 50 units shown';
  // Sprint stays a filter (the chips above) rather than an automatic grouping:
  // the number of characters per sprint isn't fixed, so a flat grid that just
  // respects whichever filters are active scales better than fixed sections.
  var body=el('clanBody');
  body.innerHTML=list.length?'<div class="card-grid">'+list.map(cardHTML).join('')+'</div>':'<div class="empty-state"><div class="glyph">\u2205</div><p>No units match these filters.</p></div>';
  body.querySelectorAll('.ccard').forEach(function(card){card.addEventListener('click',function(){openModal(card.getAttribute('data-id'));});});}

function statBars(stats){if(!stats)return '';var mx=[25,8,8,10],lab=['HP','SH','SP','DM'],cl=['b-hp','b-sh','b-sp','b-dm'];
  return '<div class="spread">'+stats.map(function(v,i){var p=Math.max(6,Math.min(100,Math.round(v/mx[i]*100)));return '<span class="lab">'+lab[i]+'</span><span class="bar '+cl[i]+'"><i style="width:'+p+'%"></i></span>';}).join('')+'</div>';}
function cardHTML(c){var img=primaryOf(c),imgs=galleryImages(c.id);
  var thumb=img?'<img loading="lazy" src="'+img.data+'" alt="'+esc(c.name)+'">'+(imgs.length>1?'<span class="imgcount">'+imgs.length+' imgs</span>':''):'<div class="noimg"><span class="glyph">'+esc(c.name.charAt(0))+'</span><span>no art</span></div>';
  return '<button class="ccard'+(isDone(c)?' done':'')+'" data-id="'+c.id+'"><div class="thumb"><span class="num">#'+c.num+'</span><span class="mana">'+c.mana+' \u2726</span>'+(isDone(c)?'<span class="done-badge">\u2713 Completed</span>':'')+thumb+'</div>'
    +'<div class="cbody"><h3 class="cname">'+esc(c.name)+'</h3>'
    +'<div class="roles"><span class="role arch">'+esc(c.arch)+'</span><span class="role">'+esc(c.type)+'</span>'+sprintTag(c)+'</div>'
    +statBars(c.stats)+statusPips(c)+'</div></button>';}

  var abilRows=c.abilities.length?'<ul class="abil-list">'+c.abilities.map(function(a){var g=GLOSS[glossKey(a)];return '<li><b>'+esc(a)+'</b>'+(g?'<span>'+esc(g)+'</span>':'<span class="mono" style="color:var(--bark);font-size:11px">no description on file</span>')+'</li>';}).join('')+'</ul>':'<p class="mono" style="color:var(--bark);font-size:12px">No abilities — starter-layer unit.</p>';
  var statusList='<div class="status-track">'+STAGES.map(function(st){return '<div class="strack '+(s[st.key]?'on':'')+'"><span class="tick">'+(s[st.key]?'\u2713':'\u25cb')+'</span>'+esc(st.label)+'</div>';}).join('')+'</div>';

  var back=h('<div class="modal-back"></div>');
  back.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><div class="modal-gallery">'+galMain+thumbs+'</div>'
    +'<div class="modal-info"><div class="el">'+esc(m.name)+' · '+esc(m.element)+' · Unit #'+c.num+' · '+esc(sprintName(c.sprint||1))+'</div><h2>'+esc(c.name)+(isDone(c)?' <span class="done-chip">\u2713 Completed</span>':'')+'</h2>'
    +'<div class="kv"><span class="k">Mana <b>'+c.mana+'</b></span><span class="k">Class <b>'+esc(c.arch)+'</b></span><span class="k">Type <b>'+esc(c.type)+'</b></span><span class="k">Tier <b>'+esc(c.tier)+'</b></span></div>'
    +'<div class="kv"><span class="k">Modeled by <b>'+esc(modeledOf(c)||'\u2014')+'</b></span><span class="k">Textured by <b>'+esc(texturedOf(c)||'\u2014')+'</b></span><span class="k">Gender <b>'+esc(c.gender||'\u2014')+'</b></span><span class="k">Height <b>'+esc(c.height?c.height+' m':'\u2014')+'</b></span></div>'
    +'<div class="kv"><span class="k">Review <b>'+esc(reviewOf(c).status||'\u2014')+'</b></span><span class="k">Reviews received <b>'+reviewOf(c).count+'</b></span><span class="k">Redos <b>'+reviewOf(c).redos+'</b></span></div>'
    +'<table class="stat-table"><tr><th>Level</th><th>HP</th><th>Shield</th><th>Speed</th><th>Damage</th></tr>'+statRow('L1',c.l1)+statRow('L6',c.l6)+statRow('L12',c.l12)+'</table>'

    +'<div class="modal-actions"><button class="btn accent" id="mEdit">Edit in dashboard</button><button class="btn ghost" id="mClose">Close</button></div></div>';
  document.body.appendChild(back);document.body.style.overflow='hidden';
  function close(){back.remove();document.body.style.overflow='';}
  back.addEventListener('click',function(e){if(e.target===back)close();});

  back.querySelector('#mEdit').addEventListener('click',function(){close();dashTab='roster';location.hash='#/dashboard';setTimeout(function(){if(el('editorMount'))startEdit(c.id);},80);});
  var curIdx=0;

  if(gi)gi.addEventListener('click',function(){openLightbox(gal,curIdx);});

  document.addEventListener('keydown',function ek(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',ek);}});}
function statRow(lvl,s){var p=(s||'').split('/');if(p.length!==4)p=['\u2014','\u2014','\u2014','\u2014'];return '<tr><td>'+lvl+'</td><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td>'+esc(p[2])+'</td><td>'+esc(p[3])+'</td></tr>';}
function openLightbox(gal,idx){if(!gal||!gal.length)return;idx=idx||0;
  var lb=h('<div class="lightbox"></div>');
  lb.innerHTML='<button class="lb-close" title="Close (Esc)">\u2715</button>'
    +(gal.length>1?'<button class="lb-nav lb-prev" title="Previous">\u2039</button><button class="lb-nav lb-next" title="Next">\u203a</button>':'')
    +'<div class="lb-stage"><img class="lb-img" src="'+gal[idx].data+'" alt=""></div>'
    +'<div class="lb-tools"><button data-z="out" title="Zoom out">\u2212</button><span class="lb-zval">100%</span><button data-z="in" title="Zoom in">+</button><button data-z="reset">Reset</button>'+(gal.length>1?'<span class="lb-count">'+(idx+1)+' / '+gal.length+'</span>':'')+'<span class="lb-hint">scroll or double-click to zoom · drag to pan</span></div>';
  document.body.appendChild(lb);document.body.style.overflow='hidden';
  var img=lb.querySelector('.lb-img'),scale=1,tx=0,ty=0,dragging=false,sx=0,sy=0;
  function apply(){img.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';lb.querySelector('.lb-zval').textContent=Math.round(scale*100)+'%';img.style.cursor=scale>1?'grab':'zoom-in';}
  function setScale(s){scale=Math.min(6,Math.max(1,Math.round(s*100)/100));if(scale===1){tx=0;ty=0;}apply();}
  function show(i){idx=(i+gal.length)%gal.length;img.src=gal[idx].data;scale=1;tx=0;ty=0;apply();var c=lb.querySelector('.lb-count');if(c)c.textContent=(idx+1)+' / '+gal.length;}
  function mm(e){if(!dragging)return;tx=e.clientX-sx;ty=e.clientY-sy;apply();}
  function mu(){dragging=false;if(scale>1)img.style.cursor='grab';}
  function key(e){if(e.key==='Escape')close();else if(e.key==='+'||e.key==='=')setScale(scale+0.3);else if(e.key==='-')setScale(scale-0.3);else if(gal.length>1&&e.key==='ArrowLeft')show(idx-1);else if(gal.length>1&&e.key==='ArrowRight')show(idx+1);}
  function close(){lb.remove();document.body.style.overflow='';window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.removeEventListener('keydown',key);}
  apply();
  lb.querySelector('.lb-close').addEventListener('click',close);
  lb.addEventListener('click',function(e){if(e.target===lb||e.target.classList.contains('lb-stage'))close();});
  img.addEventListener('wheel',function(e){e.preventDefault();setScale(scale+(e.deltaY<0?0.25:-0.25));},{passive:false});
  img.addEventListener('dblclick',function(){setScale(scale>1?1:2.4);});
  img.addEventListener('mousedown',function(e){if(scale<=1)return;dragging=true;sx=e.clientX-tx;sy=e.clientY-ty;img.style.cursor='grabbing';e.preventDefault();});
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);

  if(act==='submit'){if(!canStatus())return;c.review.status='in_review';}

  else if(act==='reject'){if(!canReview())return;c.review.status='rejected';c.review.count++;c.review.redos++;c.completed=false;}
  c.updatedAt=Date.now();
  putChar(c).then(loadCaches).then(function(){syncUpsert(c);
    toast(act==='submit'?'Submitted for review':act==='approve'?'Review approved':'Rejected \u2014 redo requested');
    if(el('editorMount')){if(edit&&edit.id===id){if(isAdmin())renderEditor(edit);else renderStatusEditor(edit,el('editorMount'));}}
    paintDashList();}).catch(function(err){toast('Update failed: '+err);});}

function renameUser(oldName,newNameRaw){var box=el('secRenameFlow');var newName=String(newNameRaw||'').trim();
  if(!newName){toast('Enter a name');return;}
  if(newName===oldName){if(box)box.innerHTML='';return;}
  if(newName===ADMIN_NAME){toast('That name is reserved for the admin');return;}
  var u=findUser(oldName);
  if(u){
    // A true rename of a current teammate: the new name must be free.
    if(findUser(newName)){toast('That name already exists');return;}
  }else{
    // oldName isn't anyone in the list today — this can only be a cleanup
    // merge of stray leftover data (e.g. assignments an earlier, incomplete
    // rename never reached) into an EXISTING teammate, never a typo that
    // would otherwise silently create a brand-new name on some records.
    if(!findUser(newName)){toast('No current teammate named "'+newName+'" to merge into');return;}
  }
  // The actual rewrite happens server-side (rename-user.js): besides
  // characters/tasks modeledBy & texturedBy, it also fixes up image upload
  // captions ('by', which the client can never write directly — see
  // images.js) and carries forward any per-sprint goal override in the
  // Scores tab, neither of which this client could safely do itself.
  api('rename-user',{method:'POST',body:{oldName:oldName,newName:newName}}).then(function(r){
    return refreshRemote().then(function(){return getSetting('users');}).then(function(us){
      USERS=(us&&us.length)?us:DEFAULT_USERS.slice();
      USERS=USERS.map(function(x){return typeof x==='string'?{name:x,role:(x===ADMIN_NAME?'Admin':'Artist')}:x;});
      return getSetting('artistGoals');
    }).then(function(ag){ARTIST_GOALS=(ag&&typeof ag==='object')?ag:{};return loadCaches();})
    .then(function(){if(CURRENT_USER===oldName)userSetLS(newName);
      var changed=(r.charactersChanged||0)+(r.tasksChanged||0)+(r.imagesChanged||0);
      toast('Renamed '+oldName+' → '+newName+(changed?' — assignments & image credits updated':''));
      if(box)box.innerHTML='';renderSecurity();renderUserWidget();
      CHARS.forEach(function(c){if(modeledOf(c)===newName||texturedOf(c)===newName)syncUpsert(c);});});
  }).catch(function(err){toast('Rename failed: '+(err&&err.message?err.message:err));});}
function computeAnalytics(){var total=CHARS.length,completed=0,reviews=0,redos=0,rejected=0,stages={approved:0,modeling:0,rigged:0,stored:0},bySprint={},byClan={},byArtist={};
  function bumpA(name,key){if(!name)return;byArtist[name]=byArtist[name]||{modeled:0,textured:0,done:0};byArtist[name][key]++;}
  CHARS.forEach(function(c){var d=isDone(c);if(d)completed++;var s=statusOf(c);STAGES.forEach(function(st){if(s[st.key])stages[st.key]++;});
    var rv=reviewOf(c);reviews+=rv.count;redos+=rv.redos;if(rv.status==='rejected')rejected++;
    var sp=c.sprint||1;bySprint[sp]=bySprint[sp]||{total:0,done:0,reviews:0,redos:0};bySprint[sp].total++;if(d)bySprint[sp].done++;bySprint[sp].reviews+=rv.count;bySprint[sp].redos+=rv.redos;
    byClan[c.clan]=byClan[c.clan]||{total:0,done:0};byClan[c.clan].total++;if(d)byClan[c.clan].done++;
    var mb=modeledOf(c),tb=texturedOf(c);bumpA(mb,'modeled');bumpA(tb,'textured');if(d&&mb)bumpA(mb,'done');});
  return{total:total,completed:completed,reviews:reviews,redos:redos,rejected:rejected,stages:stages,bySprint:bySprint,byClan:byClan,byArtist:byArtist};}

function taskImageOps(id){var existing=(IMAGES[id]||[]).map(function(im){return im.id;}),keep=taskEdit.images.map(function(im){return im.id;}),ops=[];

function saveTaskEdit(){if(!taskEdit.name||!String(taskEdit.name).trim()){toast('Name is required');return;}
  var oldT=taskEdit.id?TASKS.find(function(x){return x.id===taskEdit.id;}):null;
  var id=taskEdit.id||('task-'+uid());
  var rec={id:id,name:String(taskEdit.name).trim(),category:String(taskEdit.category||'').trim(),sprint:Number(taskEdit.sprint)||firstSprint(),status:Object.assign(defStatus(),taskEdit.status),modeledBy:taskEdit.modeledBy||'',texturedBy:taskEdit.texturedBy||'',completed:!!taskEdit.completed,primaryImageId:taskEdit.primaryId,updatedAt:Date.now(),createdAt:(oldT&&oldT.createdAt)||taskEdit.createdAt||Date.now(),history:(oldT&&oldT.history)?oldT.history.slice():[]};
  var ops=taskImageOps(id);
  if(rec.primaryImageId==null&&taskEdit.images.length)rec.primaryImageId=taskEdit.images[0].id;
  var newImgIds=taskEdit.images.map(function(im){return im.id;});
  if(!oldT){
    var parts=['created this task'];
    if(taskEdit.images.length)parts.push('added '+taskEdit.images.length+' image'+(taskEdit.images.length>1?'s':''));
    pushHistory(rec,parts.join(', '));
  }else{
    var oldStatus=Object.assign(defStatus(),oldT.status||{}),oldCompleted=isDone(oldT),oldImgIds=(IMAGES[oldT.id]||[]).map(function(im){return im.id;});
    var added=newImgIds.filter(function(iid){return oldImgIds.indexOf(iid)<0;}).length;
    var removed=oldImgIds.filter(function(iid){return newImgIds.indexOf(iid)<0;}).length;
    var note=historyNote(oldStatus,rec.status,oldCompleted,rec.completed,added,removed);
    if(oldT.name!==rec.name)note=(note?note+', ':'')+'renamed to "'+rec.name+'"';
    if((oldT.sprint||1)!==rec.sprint)note=(note?note+', ':'')+'moved to '+sprintName(rec.sprint);
    pushHistory(rec,note);

  ops.push(putTask(rec));

function saveTaskStatusOnly(){if(!taskEdit||!taskEdit.id)return;var t=TASKS.find(function(x){return x.id===taskEdit.id;});if(!t)return;

  t.modeledBy=taskEdit.modeledBy||'';t.texturedBy=taskEdit.texturedBy||'';
  var ops=taskImageOps(taskEdit.id);
  t.primaryImageId=taskEdit.primaryId;if(t.primaryImageId==null&&taskEdit.images.length)t.primaryImageId=taskEdit.images[0].id;
  var newImgIds=taskEdit.images.map(function(im){return im.id;});

  var removed=oldImgIds.filter(function(iid){return newImgIds.indexOf(iid)<0;}).length;
  var note=assignNote(historyNote(oldStatus,t.status,oldCompleted,t.completed,added,removed),oldModeled,t.modeledBy,oldTextured,t.texturedBy);
  pushHistory(t,note);
  ops.push(putTask(t));

function deleteTaskEdit(){if(!taskEdit.id||!isAdmin())return;if(!confirm('Delete "'+taskEdit.name+'" and its images?'))return;var id=taskEdit.id,ops=[delTask(id)];(IMAGES[id]||[]).forEach(function(im){ops.push(delImg(im.id));});

function addClanFromForm(){var name=(el('clNewName').value||'').trim();if(!name){toast('Enter a clan name');return;}

function renderSprints(){var m=el('sprintsMount');if(!m)return;
  m.innerHTML='<h3 style="font-size:16px;margin:0 0 4px">Sprints</h3><div class="hint" style="margin:0 0 10px">Name each sprint, set its start &amp; end dates, and add as many as you need. Setting a start date fills in a two-week end date automatically \u2014 adjust it if a sprint runs longer or shorter.</div>'
    +'<div class="sprint-rows">'+SPRINT_DEFS.map(function(s){return '<div class="sprint-row">'
      +'<input class="sp-name" data-sp="'+s.n+'" value="'+esc(s.name)+'" placeholder="Sprint name">'

      +'<input class="sp-date" type="date" data-spe="'+s.n+'" value="'+esc(s.end||'')+'" title="End date">'
      +(SPRINT_DEFS.length>1?'<button class="btn danger xs" data-sp-del="'+s.n+'" title="Remove sprint">\u2715</button>':'')+'</div>';}).join('')+'</div>'
    +'<div class="panel-row" style="margin-top:10px"><button class="btn accent sm" id="addSprint">+ Add sprint</button>'
      +'<input id="sprintUpTo" type="number" min="1" placeholder="e.g. 30" style="width:80px">'
      +'<button class="btn ghost sm" id="addSprintsUpTo">Fill up to sprint #</button></div>';
  function upd(n,k,v){for(var i=0;i<SPRINT_DEFS.length;i++)if(SPRINT_DEFS[i].n===n)SPRINT_DEFS[i][k]=v;}
  m.querySelectorAll('.sp-name').forEach(function(inp){inp.addEventListener('change',function(){upd(Number(inp.getAttribute('data-sp')),'name',inp.value.trim()||'Untitled sprint');saveSprints().then(function(){toast('Sprint saved');});});});
  m.querySelectorAll('[data-sps]').forEach(function(inp){inp.addEventListener('change',function(){var n=Number(inp.getAttribute('data-sps'));upd(n,'start',inp.value);
    // Our sprints usually run two weeks \u2014 if there's no end date yet, suggest one 13 days out (14-day span) rather than leaving the admin to compute it by hand.
    var s=sprintDef(n);if(s&&inp.value&&!s.end){var d=new Date(inp.value+'T00:00:00');d.setDate(d.getDate()+13);var end=d.toISOString().slice(0,10);upd(n,'end',end);var ei=m.querySelector('[data-spe="'+n+'"]');if(ei)ei.value=end;}
    saveSprints();});});
  m.querySelectorAll('[data-spe]').forEach(function(inp){inp.addEventListener('change',function(){upd(Number(inp.getAttribute('data-spe')),'end',inp.value);saveSprints();});});

  el('addSprintsUpTo').addEventListener('click',function(){
    var target=Number(el('sprintUpTo').value);
    if(!target||target<1){toast('Enter a sprint number to fill up to');return;}
    var mx=0;SPRINT_DEFS.forEach(function(s){if(s.n>mx)mx=s.n;});
    if(target<=mx){toast('Sprint '+target+' already exists');return;}
    // Jumping from a handful of sprints to the dozens is tedious one at a time —
    // this fills in every sprint in between at once, chaining each one's dates
    // two weeks off the last so a long run gets sensible placeholders rather
    // than being left blank. Names and dates can still be adjusted individually.
    var last=SPRINT_DEFS.length?SPRINT_DEFS[SPRINT_DEFS.length-1]:null;
    var cursor=(last&&(last.end||last.start))?new Date((last.end||last.start)+'T00:00:00'):new Date();

  return ops;}

})();
